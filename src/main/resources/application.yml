server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crossairlines
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    date-format: yyyy-MM-dd
    time-zone: UTC

logging:
  level:
    com.crossairlines: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE